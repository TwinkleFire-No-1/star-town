# 星火小镇 — Docker Compose 配置
# T5.5.1 Docker化: 开发模式（基础设施）+ 生产模式（全容器）
#
# 使用方式：
#   开发模式：docker compose up -d                 # 仅启动 PostgreSQL + Redis，前后端本机运行
#   生产模式：docker compose --profile production up -d  # 启动全部服务
#
# 自动沿用项目根目录 .env 文件；国内构建镜像可追加：
#   docker compose build --build-arg NPM_REGISTRY=https://registry.npmmirror.com

services:
  # === 基础设施服务（开发模式也使用） ===
  postgres:
    image: pgvector/pgvector:pg16
    container_name: star-town-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sparktown
      POSTGRES_PASSWORD: sparktown_dev
      POSTGRES_DB: sparktown
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparktown"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: star-town-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === 生产模式应用容器 ===
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        # 国内构建加速（默认已指向 npmmirror）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: star-town-server:latest
    container_name: star-town-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # 容器内通过服务名访问数据库与 Redis
      DATABASE_URL: postgresql://sparktown:sparktown_dev@postgres:5432/sparktown?schema=public
      REDIS_URL: redis://redis:6379
      # LLM 配置沿用根目录 .env 文件
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL}
      # CORS 允许来源（逗号分隔；生产走 Nginx 同源代理时可不配）
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1}
      # 游戏配置
      GAME_TIME_SCALE: ${GAME_TIME_SCALE:-48}
      MAX_ONLINE_PLAYERS: ${MAX_ONLINE_PLAYERS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - production

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # 国内构建加速（默认官方源；国内可传 NPM_REGISTRY=https://registry.npmmirror.com）
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: star-town-client:latest
    container_name: star-town-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
